[project]
name = "funcy-pipe"
version = "0.14.0"
description = "If Funcy and Pipe had a baby. Decorates all Funcy methods with Pipe superpowers."
keywords = [
  "python",
  "functional-programming",
  "pipe",
  "funcy",
  "data-manipulation",
]
readme = "README.md"
requires-python = ">=3.8"
dependencies = ["funcy>=2.0"]
authors = [{ name = "Michael Bianco", email = "mike@mikebian.co" }]
license = { file = "LICENSE" }
urls = { "Repository" = "https://github.com/iloveitaly/funcy-pipe", "Documentation" = "https://iloveitaly.github.io/funcy-pipe/" }

[build-system]
requires = ["uv_build>=0.11.0,<0.12"]
build-backend = "uv_build"

[tool.uv.build-backend]
# avoids the src/ directory structure
module-root = ""

[tool.uv.sources.funcy]
git = "https://github.com/Suor/funcy.git"

[dependency-groups]
dev = [
    "pytest>=8.3.4",
    "pyright[nodejs]>=1.1.408",
    "ruff>=0.15.0",
    # coverage stack needs modern Python; package still supports 3.8+ in CI matrix
    "coverage>=7.13.4; python_full_version >= '3.10'",
    "pytest-cov>=7.0.0; python_full_version >= '3.10'",
    "covdefaults>=2.3.0; python_full_version >= '3.10'",
    "pytest-markdown-docs>=0.5.1",
]
# Sphinx toolchain for local/CI docs builds — not a published package extra.
# Markers keep resolution viable for the package's broader requires-python (>=3.8);
# docs CI/local builds use a modern Python via mise.
docs = [
    "sphinx>=7.1.2; python_full_version >= '3.10'",
    "shibuya; python_full_version >= '3.10'",
    "myst-parser>=2.0.0; python_full_version >= '3.10'",
    "sphinx-design>=0.5.0; python_full_version >= '3.10'",
    "sphinx-copybutton>=0.5.2; python_full_version >= '3.10'",
    "sphinx-autobuild; python_full_version >= '3.10'",
    "sphinx-autoapi; python_full_version >= '3.10'",
    "sphinx-llm; python_full_version >= '3.10'",
]

[tool.pyright]
exclude = ["examples/", "playground/", "tmp/", ".venv/", "tests/", "docs/"]

[tool.pytest.ini_options]
# Coverage flags omitted from default addopts so the 3.8/3.9 CI matrix stays green.
# Use `just test-cov` (Python >= 3.10) for coverage.
addopts = "--doctest-modules --markdown-docs"

[tool.coverage.run]
plugins = ["covdefaults"]
source = ["funcy_pipe"]

[tool.coverage.report]
fail_under = 50
